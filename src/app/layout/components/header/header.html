<header class="sticky top-0 z-30 border-b border-white/10 bg-ink-950/80 backdrop-blur-xl">
  <div class="flex h-16 items-center gap-3 px-4 sm:px-6 lg:px-8">
    <button type="button" class="icon-button lg:hidden" (click)="menuToggled.emit()" aria-label="Open navigation">☰</button>

    <div class="hidden min-w-0 sm:block">
      <p class="text-[10px] uppercase tracking-[0.2em] text-mist-500">Welcome back</p>
      <p class="truncate text-sm font-semibold text-mist-100">{{ firstName }}</p>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <a routerLink="/app/search" class="icon-button" title="Search notes" aria-label="Search notes">⌕</a>
      @if (isAdmin) {
        <a routerLink="/app/activity" class="icon-button hidden sm:inline-flex" title="Activity" aria-label="Activity">∿</a>
      }
      <app-theme-toggle />
      @if (isAdmin) {
        <a routerLink="/app/notes/create" class="btn-primary min-h-10 px-4 text-xs">
          <span class="text-base leading-none">+</span>
          New note
        </a>
      } @else {
        <a routerLink="/notes" class="btn-primary min-h-10 px-4 text-xs">Browse notes</a>
      }
    </div>
  </div>
</header>

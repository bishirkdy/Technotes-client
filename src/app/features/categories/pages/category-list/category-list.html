<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold text-gray-900">Categories</h1>
    <p class="mt-1 text-sm text-gray-500">Browse knowledge by technology.</p>
  </div>
  <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
    @for (c of data.categories; track c.name) {
      <a
        [routerLink]="['/notes']"
        class="rounded-2xl border border-gray-200 bg-white p-6 hover:-translate-y-0.5 hover:shadow-sm"
        ><div class="flex items-center justify-between">
          <div
            class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-100 font-bold text-gray-700"
          >
            {{ c.name[0] }}
          </div>
          <span class="text-xs text-gray-400">{{ c.count }} notes</span>
        </div>
        <h2 class="mt-5 font-semibold text-gray-900">{{ c.name }}</h2>
        <p class="mt-2 text-sm text-gray-500">{{ c.description }}</p>
        <span class="mt-5 inline-block text-sm font-semibold text-gray-700">Explore →</span></a
      >
    }
  </div>
</div>

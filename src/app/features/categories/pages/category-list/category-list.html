<div class="mx-auto max-w-7xl px-6 py-10">
  <div>
    <p class="text-sm font-medium text-gray-500">Explore</p>
    <h1 class="mt-1 text-4xl font-bold text-gray-900">Categories</h1>
    <p class="mt-2 max-w-2xl text-sm text-gray-500">
      Browse notes by category.
    </p>
  </div>

  <div class="mt-8 grid gap-2">
    @for (category of categories; track category) {
      <button
        class="rounded-xl border border-gray-200 px-4 py-2 text-sm hover:bg-gray-50 transition-colors"
      >
        {{ category }}
      </button>
    }
  </div>
</div>

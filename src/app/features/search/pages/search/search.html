<div class="space-y-6"><div><h1 class="text-3xl font-bold text-gray-900">Search</h1><p class="mt-1 text-sm text-gray-500">Search your notes by title.</p></div><form (ngSubmit)="search()" class="flex gap-2"><input [(ngModel)]="query" name="query" placeholder="Search notes..." class="flex-1 rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm outline-none"/><button class="rounded-xl bg-gray-900 px-5 py-3 text-sm font-semibold text-white">Search</button></form>@if(loading){<p class="text-gray-500">Searching...</p>}@else if(error){<p class="text-red-600">{{error}}</p>}@else if(searched&&results.length===0){<div class="rounded-2xl border border-dashed border-gray-300 bg-white p-10 text-center text-gray-500">No matching notes.</div>}@else if(searched){<div class="grid gap-5 md:grid-cols-2">@for(note of results;track note.id){<article class="rounded-2xl border border-gray-200 bg-white p-5"><h2 class="font-semibold text-gray-900">{{note.title}}</h2><p class="mt-2 line-clamp-3 text-sm text-gray-500">{{preview(note)}}</p><a [routerLink]="['/notes',note.id]" class="mt-5 inline-block text-sm font-semibold">Open →</a></article>}</div>}</div>

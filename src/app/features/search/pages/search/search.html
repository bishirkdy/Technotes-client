<div class="space-y-6">
  <div>
    <p class="text-sm text-gray-500">Discover</p>
    <h1 class="mt-1 text-3xl font-bold">Search</h1>
  </div>
  <input
    autofocus
    [(ngModel)]="query"
    placeholder="Search notes, topics and tags..."
    class="w-full rounded-2xl border border-gray-200 bg-white px-5 py-4 text-sm outline-none focus:border-gray-400"
  />
  <div class="space-y-3">
    @if (!query) {
      <div
        class="rounded-2xl border border-dashed border-gray-300 bg-white p-12 text-center text-sm text-gray-400"
      >
        Start typing to search the dummy knowledge base.
      </div>
    } @else if (!results.length) {
      <div
        class="rounded-2xl border border-gray-200 bg-white p-10 text-center text-sm text-gray-500"
      >
        No results for “{{ query }}”.
      </div>
    } @else {
      @for (note of results; track note.id) {
        <a
          [routerLink]="['/notes', note.id]"
          class="block rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-sm"
          ><div class="text-xs text-gray-400">{{ note.category }}</div>
          <h2 class="mt-2 font-semibold">{{ note.title }}</h2>
          <p class="mt-1 text-sm text-gray-500">{{ note.description }}</p></a
        >
      }
    }
  </div>
</div>

@if (loading) {
  <div class="p-10 text-center text-gray-500">Loading note...</div>
} @else if (error && !note.title) {
  <div class="rounded-xl border border-red-200 bg-red-50 p-6 text-red-600">{{ error }}</div>
} @else {
  <div class="space-y-6">
    <div class="flex items-center justify-between gap-4">
      <div>
        <a routerLink="/app/notes" class="text-sm text-gray-400">My Notes</a>
        <h1 class="mt-1 text-3xl font-bold">Edit Note</h1>
      </div>
      <div class="flex gap-2">
        <button (click)="delete()" class="rounded-xl border border-red-200 px-4 py-2 text-sm text-red-600">Delete</button>
        <button (click)="save()" [disabled]="saving" class="rounded-xl bg-gray-900 px-4 py-2 text-sm font-semibold text-white">
          {{ saving ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </div>

    @if (error) {
      <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-600">{{ error }}</div>
    }

    <div class="grid gap-6 xl:grid-cols-[280px_minmax(0,1fr)_240px]">
      <aside class="rounded-2xl border border-gray-200 bg-white p-4">
        <div class="flex justify-between">
          <h2 class="font-semibold">Outline</h2>
          <button (click)="addSection()" class="text-sm">+</button>
        </div>
        <div class="mt-4 space-y-1">
          @for (item of flattenSections(note.sections); track item.section.id) {
            <div class="flex" [style.padding-left.px]="item.level * 16">
              <button
                (click)="selectSection(item.section.id)"
                class="flex-1 truncate rounded-lg px-2 py-2 text-left text-sm"
                [class.bg-gray-900]="activeSectionId === item.section.id"
                [class.text-white]="activeSectionId === item.section.id"
              >
                {{ item.number }} {{ item.section.title }}
              </button>
              <button (click)="addSection(item.section.id)" class="px-1 text-gray-500">+</button>
            </div>
          }
        </div>
      </aside>

      <main class="space-y-6">
        <section class="rounded-2xl border border-gray-200 bg-white p-6">
          <label class="text-xs uppercase text-gray-400">Title</label>
          <input [(ngModel)]="note.title" maxlength="200" class="mt-2 w-full text-3xl font-bold outline-none" />
        </section>

        @if (activeSection; as section) {
          <section class="rounded-2xl border border-gray-200 bg-white p-6">
            <input
              [ngModel]="section.title"
              (ngModelChange)="section.title = $event"
              class="mb-5 text-xl font-semibold outline-none"
            />
            <app-content-block [blocks]="section.contents" (blocksChange)="setBlocks(section.id, $event)" />
          </section>
        }
      </main>

      <aside class="rounded-2xl border border-gray-200 bg-white p-5">
        <h2 class="font-semibold">Publishing</h2>
        <label class="mt-4 block text-xs font-medium text-gray-600">Visibility
          <select [(ngModel)]="note.visibility" class="mt-2 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm">
            <option [ngValue]="1">Private</option>
            <option [ngValue]="2">Shared</option>
            <option [ngValue]="3">Public</option>
          </select>
        </label>
        <label class="mt-4 block text-xs font-medium text-gray-600">Status
          <select [(ngModel)]="note.status" class="mt-2 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm">
            @for (status of statuses; track status.value) {
              <option [ngValue]="status.value">{{ status.label }}</option>
            }
          </select>
        </label>
      </aside>
    </div>
  </div>
}

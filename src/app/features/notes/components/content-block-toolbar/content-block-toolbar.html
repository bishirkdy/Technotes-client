<div class="relative">
  <button
    type="button"
    (click)="toggleMenu()"
    class="flex items-center gap-2 rounded-2xl border border-dashed border-white/15 bg-white/[0.03] px-4 py-3 text-sm font-semibold text-mist-300 transition hover:border-acid-400/40 hover:bg-acid-400/[0.04] hover:text-mist-50"
    [attr.aria-expanded]="isOpen"
  >
    <span class="text-lg leading-none text-acid-300">+</span>
    <span>Add content</span>
  </button>

  @if (isOpen) {
    <div class="glass-panel absolute bottom-full left-0 z-30 mb-3 w-80 overflow-hidden rounded-3xl">
      <div class="border-b border-white/10 px-4 py-3">
        <p class="text-sm font-semibold text-mist-50">Add content</p>
        <p class="mt-1 text-xs text-mist-400">Choose a block for this section</p>
      </div>

      <div class="max-h-80 overflow-y-auto p-2">
        @for (option of options; track option.type) {
          <button
            type="button"
            (click)="selectBlock(option.type)"
            class="flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition hover:bg-white/[0.06]"
          >
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/[0.04] text-xs font-semibold text-acid-300">
              {{ option.glyph }}
            </span>
            <span class="min-w-0">
              <span class="block text-sm font-medium text-mist-100">{{ option.label }}</span>
              <span class="block truncate text-xs text-mist-400">{{ option.description }}</span>
            </span>
          </button>
        }
      </div>
    </div>
  }
</div>

<div class="rounded-xl border border-gray-200 bg-white p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-gray-800">
      Points
    </h4>

    <p class="text-xs text-gray-500">
      Add important points or key takeaways
    </p>
  </div>

  <div class="space-y-2">

    @for (point of points; track $index) {
      <div class="flex gap-2">

        <input
          type="text"
          [value]="point"
          (input)="updatePoint($index, $any($event.target).value)"
          placeholder="Enter a point..."
          class="flex-1 rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-gray-400"
        />

        <button
          type="button"
          (click)="removePoint($index)"
          class="rounded-lg px-3 text-sm text-red-500 hover:bg-red-50"
        >
          Remove
        </button>

      </div>
    }

  </div>

  <button
    type="button"
    (click)="addPoint()"
    class="mt-3 rounded-lg border border-gray-200 px-3 py-2 text-sm font-medium hover:bg-gray-50"
  >
    + Add Point
  </button>

</div>

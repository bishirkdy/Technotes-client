<div class="rounded-xl border border-white/10 bg-ink-900/60 p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-mist-100">
      Points
    </h4>

    <p class="text-xs text-mist-400">
      Add important points or key takeaways
    </p>
  </div>

  <div class="space-y-2">

    @for (point of points; track $index) {
      <div class="flex gap-2">

        <input
          type="text"
          [value]="point"
          (input)="updatePoint($index, $any($event.target).value)"
          placeholder="Enter a point..."
          class="flex-1 rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100 outline-none focus:border-acid-400/50"
        />

        <button
          type="button"
          (click)="removePoint($index)"
          class="rounded-lg px-3 text-sm text-rose-400 hover:bg-red-50"
        >
          Remove
        </button>

      </div>
    }

  </div>

  <button
    type="button"
    (click)="addPoint()"
    class="mt-3 rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100 font-medium hover:bg-white/[0.04]"
  >
    + Add Point
  </button>

</div>

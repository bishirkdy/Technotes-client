<div class="rounded-xl border border-gray-200 bg-white p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-gray-800">
      Example
    </h4>

    <p class="text-xs text-gray-500">
      Show a practical example
    </p>
  </div>

  <div class="space-y-4">

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-700">
        Title
      </label>

      <input
        type="text"
        [value]="data.title || ''"
        (input)="updateField('title', $any($event.target).value)"
        placeholder="Example title"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
      />
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-700">
        Description
      </label>

      <textarea
        rows="3"
        [value]="data.description || ''"
        (input)="updateField('description', $any($event.target).value)"
        placeholder="Explain the example..."
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
      ></textarea>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-700">
        Code
      </label>

      <textarea
        rows="6"
        [value]="data.code || ''"
        (input)="updateField('code', $any($event.target).value)"
        placeholder="Example code..."
        class="w-full rounded-lg border border-gray-200 px-3 py-2 font-mono text-sm"
      ></textarea>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-700">
        Result / Output
      </label>

      <textarea
        rows="3"
        [value]="data.result || ''"
        (input)="updateField('result', $any($event.target).value)"
        placeholder="Expected result..."
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
      ></textarea>
    </div>

  </div>

</div>

<div class="rounded-xl border border-white/10 bg-ink-900/60 p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-mist-100">
      Code
    </h4>

    <p class="text-xs text-mist-400">
      Add a code snippet
    </p>
  </div>

  <div class="space-y-4">

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

      <div>
        <label class="mb-1 block text-xs font-medium text-mist-200">
          Language
        </label>

        <select
          [value]="data.language || 'csharp'"
          (change)="setLanguage($any($event.target).value)"
          class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
        >
          <option value="csharp">C#</option>
          <option value="typescript">TypeScript</option>
          <option value="javascript">JavaScript</option>
          <option value="sql">SQL</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="bash">Bash</option>
          <option value="xml">XML</option>
          <option value="plaintext">Plain text</option>
        </select>
      </div>

      <div>
        <label class="mb-1 block text-xs font-medium text-mist-200">
          Filename
        </label>

        <input
          type="text"
          [value]="data.filename || ''"
          (input)="updateField('filename', $any($event.target).value)"
          placeholder="Program.cs"
          class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
        />
      </div>

    </div>

    @if (data.language === 'sql') {
      <div>
        <label class="mb-1 block text-xs font-medium text-mist-200">
          SQL dialect
        </label>

        <select
          [value]="data.dialect || 'sqlserver'"
          (change)="updateField('dialect', $any($event.target).value)"
          class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
        >
          @for (dialect of sqlDialects; track dialect.value) {
            <option [value]="dialect.value">{{ dialect.label }}</option>
          }
        </select>

        <p class="mt-1.5 text-[11px] text-cyan-300/80">
          SQL Server and PostgreSQL run in isolated databases.
        </p>
      </div>
    }

    <div>
      <label class="mb-1 block text-xs font-medium text-mist-200">
        Code
      </label>

      <textarea
        rows="10"
        [value]="data.code || ''"
        (input)="updateField('code', $any($event.target).value)"
        placeholder="Write your code..."
        class="w-full rounded-lg border border-white/10 px-3 py-2 font-mono text-sm text-mist-100"
      ></textarea>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-mist-200">
        Expected output
      </label>

      <textarea
        rows="3"
        [value]="data.expectedOutput || data.result || ''"
        (input)="updateField('expectedOutput', $any($event.target).value)"
        placeholder="Optional output shown below the example"
        class="w-full rounded-lg border border-white/10 px-3 py-2 font-mono text-sm text-mist-100"
      ></textarea>

      @if (data.language === 'html' || data.language === 'css' || data.language === 'javascript') {
        <p class="mt-1.5 text-[11px] text-acid-300/80">
          This language gets a sandboxed Try It editor in the reader.
        </p>
      }
    </div>

    <div class="flex flex-wrap items-center gap-4">

      <label class="flex items-center gap-2 text-sm text-mist-300">
        <input
          type="checkbox"
          [checked]="data.showLineNumbers ?? true"
          (change)="updateField('showLineNumbers', $any($event.target).checked)"
        />
        Show line numbers
      </label>

      <label class="flex items-center gap-2 text-sm text-mist-300">
        <input
          type="checkbox"
          [checked]="data.wrapCode ?? false"
          (change)="updateField('wrapCode', $any($event.target).checked)"
        />
        Wrap code
      </label>

      <label class="flex items-center gap-2 text-sm text-mist-300">
        <input
          type="checkbox"
          [checked]="data.runnable ?? true"
          (change)="updateField('runnable', $any($event.target).checked)"
        />
        Runnable
      </label>

    </div>

  </div>

</div>

@if (data.url) {
  <div class="glass-card overflow-hidden rounded-3xl">
    <div class="relative group">
      <img
        [src]="data.url"
        [alt]="data.alt || 'Note image'"
        class="max-h-[36rem] w-full object-cover"
        loading="lazy"
        decoding="async"
      />

      <div class="absolute inset-0 flex items-center justify-center gap-2 bg-ink-950/70 opacity-0 backdrop-blur-sm transition group-hover:opacity-100 group-focus-within:opacity-100">
        <label class="btn-ghost cursor-pointer text-xs">
          Replace
          <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="sr-only" (change)="selectFile($event)" />
        </label>
        <button type="button" class="btn-danger" (click)="remove()">Remove</button>
      </div>
    </div>

    <div class="grid gap-4 p-4 sm:grid-cols-2">
      <label class="field-label">
        Alt text
        <input
          class="field mt-2"
          [ngModel]="data.alt ?? ''"
          (ngModelChange)="updateAlt($event)"
          placeholder="Describe the image"
          maxlength="240"
        />
      </label>

      <label class="field-label">
        Caption
        <input
          class="field mt-2"
          [ngModel]="data.caption ?? ''"
          (ngModelChange)="updateCaption($event)"
          placeholder="Optional caption"
          maxlength="280"
        />
      </label>
    </div>
  </div>
} @else {
  <label
    class="glass-inset flex min-h-56 cursor-pointer flex-col items-center justify-center rounded-3xl border-dashed px-6 py-10 text-center transition"
    [class.border-acid-400/50]="dragging"
    [class.bg-acid-400/5]="dragging"
    (dragover)="dragOver($event)"
    (dragleave)="dragLeave()"
    (drop)="dropFile($event)"
  >
    <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="sr-only" (change)="selectFile($event)" />

    <span class="flex h-14 w-14 items-center justify-center rounded-2xl border border-acid-400/20 bg-acid-400/10 text-2xl text-acid-300">
      ▧
    </span>
    <span class="mt-4 text-sm font-semibold text-mist-50">
      {{ uploading ? 'Uploading image…' : 'Drop an image or click to browse' }}
    </span>
    <span class="mt-1 text-xs text-mist-400">JPEG, PNG, WebP or GIF · up to 10 MB</span>

    @if (uploading) {
      <span class="mt-5 h-1.5 w-full max-w-xs overflow-hidden rounded-full bg-white/10">
        <span class="block h-full rounded-full bg-acid-400 transition-all" [style.width.%]="progress"></span>
      </span>
      <span class="mt-2 text-xs text-acid-300">{{ progress }}%</span>
    }
  </label>
}

@if (error) {
  <p class="mt-3 rounded-xl border border-rose-400/20 bg-rose-400/10 px-3 py-2 text-xs text-rose-200">{{ error }}</p>
}

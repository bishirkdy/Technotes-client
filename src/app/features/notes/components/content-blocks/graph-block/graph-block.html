<div class="rounded-xl border border-white/10 bg-ink-900/60 p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-mist-100">
      Graph
    </h4>

    <p class="text-xs text-mist-400">
      Add data for a graph or chart
    </p>
  </div>

  <div class="space-y-4">

    <input
      type="text"
      [value]="data.title || ''"
      (input)="updateField('title', $any($event.target).value)"
      placeholder="Graph title"
      class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
    />

    <select
      [value]="data.graphType || 'bar'"
      (change)="updateField('graphType', $any($event.target).value)"
      class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
    >
      <option value="bar">Bar Chart</option>
      <option value="line">Line Chart</option>
      <option value="pie">Pie Chart</option>
    </select>

    <div class="space-y-2">

      @for (row of rows; track $index) {
        <div class="flex gap-2">

          <input
            type="text"
            [value]="row.label"
            (input)="updateRow($index, 'label', $any($event.target).value)"
            placeholder="Label"
            class="flex-1 rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
          />

          <input
            type="number"
            [value]="row.value"
            (input)="updateRow($index, 'value', $any($event.target).value)"
            placeholder="Value"
            class="w-32 rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
          />

          <button
            type="button"
            (click)="removeRow($index)"
            class="rounded-lg px-3 text-sm text-rose-400"
          >
            Remove
          </button>

        </div>
      }

    </div>

    <button
      type="button"
      (click)="addRow()"
      class="rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
    >
      + Add Data
    </button>

    <div class="flex h-48 items-center justify-center rounded-xl border border-dashed border-white/15 bg-white/[0.04]">
      <span class="text-sm text-mist-500">
        Graph preview
      </span>
    </div>

  </div>

</div>

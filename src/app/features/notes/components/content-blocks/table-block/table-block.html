<div class="rounded-xl border border-gray-200 bg-white p-4">
  <div class="mb-4">
    <h4 class="text-sm font-semibold text-gray-800">Table</h4>

    <p class="text-xs text-gray-500">Create a structured table</p>
  </div>

  <div class="space-y-4">
    <input
      type="text"
      [value]="data.title || ''"
      (input)="updateField('title', $any($event.target).value)"
      placeholder="Table title"
      class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
    />

    <textarea
      rows="2"
      [value]="data.description || ''"
      (input)="updateField('description', $any($event.target).value)"
      placeholder="Table description..."
      class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
    ></textarea>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-sm">
        <thead>
          <tr>
            @for (column of columns; track $index) {
              <th class="border border-gray-200 p-2">
                <input
                  type="text"
                  [value]="column"
                  (input)="updateColumn($index, $any($event.target).value)"
                  class="w-full bg-transparent font-medium outline-none"
                />
              </th>
            }

            <th class="border border-gray-200 p-2">Actions</th>
          </tr>
        </thead>

        <tbody>
          @for (row of rows; track $index; let rowIndex = $index) {
            <tr>
              @for (cell of row; track $index; let columnIndex = $index) {
                <td class="border border-gray-200 p-2">
                  <input
                    type="text"
                    [value]="cell"
                    (input)="updateCell(rowIndex, columnIndex, $any($event.target).value)"
                    class="w-full bg-transparent outline-none"
                  />
                </td>
              }

              <td class="border border-gray-200 p-2">
                <button type="button" (click)="removeRow(rowIndex)" class="text-xs text-red-500">
                  Remove
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="addRow()"
        class="rounded-lg border border-gray-200 px-3 py-2 text-sm hover:bg-gray-50"
      >
        + Add Row
      </button>

      <button
        type="button"
        (click)="addColumn()"
        class="rounded-lg border border-gray-200 px-3 py-2 text-sm hover:bg-gray-50"
      >
        + Add Column
      </button>
    </div>
  </div>
</div>

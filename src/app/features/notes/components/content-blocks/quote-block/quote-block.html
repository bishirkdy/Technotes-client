<div class="rounded-xl border border-gray-200 bg-white p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-gray-800">
      Quote
    </h4>

    <p class="text-xs text-gray-500">
      Highlight an important statement
    </p>
  </div>

  <div class="space-y-4">

    <textarea
      rows="4"
      [value]="data.quote || ''"
      (input)="updateField('quote', $any($event.target).value)"
      placeholder="Write the quote..."
      class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
    ></textarea>

    <input
      type="text"
      [value]="data.author || ''"
      (input)="updateField('author', $any($event.target).value)"
      placeholder="Author"
      class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
    />

    <input
      type="text"
      [value]="data.source || ''"
      (input)="updateField('source', $any($event.target).value)"
      placeholder="Source"
      class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm"
    />

  </div>

</div>

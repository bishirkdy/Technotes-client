<div class="rounded-xl border border-white/10 bg-ink-900/60 p-4">

  <div class="mb-4">
    <h4 class="text-sm font-semibold text-mist-100">
      Quote
    </h4>

    <p class="text-xs text-mist-400">
      Highlight an important statement
    </p>
  </div>

  <div class="space-y-4">

    <textarea
      rows="4"
      [value]="data.quote || ''"
      (input)="updateField('quote', $any($event.target).value)"
      placeholder="Write the quote..."
      class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
    ></textarea>

    <input
      type="text"
      [value]="data.author || ''"
      (input)="updateField('author', $any($event.target).value)"
      placeholder="Author"
      class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
    />

    <input
      type="text"
      [value]="data.source || ''"
      (input)="updateField('source', $any($event.target).value)"
      placeholder="Source"
      class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-mist-100"
    />

  </div>

</div>

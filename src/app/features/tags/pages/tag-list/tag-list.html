<div class="space-y-6">
  <app-page-header
    eyebrow="Organize"
    title="Tags"
    description="Tags are collected from the notes you own. Tag management endpoints are not exposed by the API."
  >
    <a routerLink="/app/notes" class="btn-ghost text-xs">Go to my notes</a>
  </app-page-header>

  @if (loading) {
    <div class="skeleton h-40 rounded-3xl"></div>
  } @else if (error) {
    <app-empty-state title="Could not load tags" [message]="error">
      <button type="button" class="btn-ghost text-xs" (click)="load()">Try again</button>
    </app-empty-state>
  } @else if (tags.length === 0) {
    <app-empty-state
      title="No tags yet"
      message="Tags added to your notes will be collected here automatically."
    >
      <a routerLink="/app/notes/create" class="btn-primary text-xs">Create a note</a>
    </app-empty-state>
  } @else {
    <div class="glass-panel rounded-3xl p-5 sm:p-6">
      <div class="flex flex-wrap gap-2">
        @for (tag of tags; track tag.name) {
          <a
            [routerLink]="['/app/notes']"
            [queryParams]="{ tag: tag.name }"
            class="group inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/[0.035] px-4 py-2 text-sm text-mist-200 transition hover:border-acid-400/30 hover:bg-acid-400/10 hover:text-acid-300"
          >
            #{{ tag.name }}
            <span class="rounded-full bg-black/25 px-2 py-0.5 text-[10px] text-mist-400">{{ tag.count }}</span>
          </a>
        }
      </div>
    </div>
  }
</div>

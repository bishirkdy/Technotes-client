<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold text-gray-900">Tags</h1>
    <p class="mt-1 text-sm text-gray-500">Find notes by topic and keyword.</p>
  </div>
  <div class="rounded-2xl border border-gray-200 bg-white p-6">
    <div class="flex flex-wrap gap-3">
      @for (tag of tags; track tag[0]) {
        <button
          class="rounded-full border border-gray-200 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50"
        >
          #{{ tag[0] }} <span class="ml-1 text-xs text-gray-400">{{ tag[1] }}</span>
        </button>
      }
    </div>
  </div>
</div>

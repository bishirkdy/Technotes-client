<div class="space-y-6"><div><h1 class="text-3xl font-bold">Profile</h1><p class="mt-1 text-sm text-gray-500">Your authenticated account details.</p></div>@if(user){<div class="max-w-xl rounded-2xl border border-gray-200 bg-white p-6"><div class="flex items-center gap-4"><div class="flex h-14 w-14 items-center justify-center rounded-full bg-gray-900 font-bold text-white">{{(user.userName||'U').slice(0,2).toUpperCase()}</div><div><h2 class="font-semibold">{{user.userName||'User'}}</h2><p class="text-sm text-gray-500">{{user.email}}</p></div></div><dl class="mt-6 space-y-4 text-sm"><div><dt class="text-gray-400">User ID</dt><dd class="mt-1 break-all text-gray-700">{{user.userId}}</dd></div><div><dt class="text-gray-400">Roles</dt><dd class="mt-1 text-gray-700">{{user.roles.join(', ') || 'User'}}</dd></div></dl><button (click)="refresh()" [disabled]="loading" class="mt-6 rounded-lg border border-gray-200 px-4 py-2 text-sm">{{loading?'Refreshing...':'Refresh profile'}}</button>@if(error){<p class="mt-3 text-sm text-red-600">{{error}}</p>}</div>}@else{<p class="text-gray-500">No user information available.</p>}</div>

<div class="p-6">
  <h2 class="text-xl font-bold text-gray-900">{{ topic.topic }}</h2>

  @if (topic && topic.lessons) {
    <ul class="mt-4 space-y-2">
      @for (lesson of topic.lessons; track lesson.slug) {
        <li>
          <a routerLink="/learn/{{ topic.slug }}/{{ lesson.slug }}" class="text-blue-600 hover underline">
            {{ lesson.title }}
          </a>
        </li>
      }
    </ul>
  } @else {
    <p class="text-gray-400">Topic not found</p>
  }
</div>

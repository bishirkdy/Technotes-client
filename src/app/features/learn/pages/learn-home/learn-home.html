<div class="p-6">
  <h2 class="text-xl font-bold text-gray-900">Learning Path</h2>
  <ul class="mt-4 space-y-2">
    @for (lesson of lessons; track lesson.slug) {
      <li>
        <a routerLink="/learn/{{ lesson.slug }}" class="text-blue-600 hover underline">
          {{ lesson.topic }}
        </a> - {{ lesson.description }}
      </li>
    }
    @if (lessons.length === 0) {
      <li class="text-gray-400">No lessons available</li>
    }
  </ul>
</div>

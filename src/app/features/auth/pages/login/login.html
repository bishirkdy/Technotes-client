<app-auth-shell
  eyebrow="Welcome back"
  title="Sign in"
  subtitle="Return to your saved place and keep reading."
>
  @if (error) {
    <div class="mb-5 rounded-2xl border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm text-rose-200">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="submit()" class="space-y-4">
    <label class="field-label">
      Email
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        autocomplete="email"
        class="field mt-2"
        placeholder="you@example.com"
      />
    </label>

    <label class="field-label">
      Password
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        autocomplete="current-password"
        class="field mt-2"
        placeholder="••••••••"
      />
    </label>

    <div class="flex justify-end">
      <a routerLink="/forgot-password" class="text-xs text-mist-400 transition hover:text-acid-300">Forgot password?</a>
    </div>

    <button
      type="submit"
      [disabled]="loading"
      class="btn-primary w-full disabled:opacity-60"
    >
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-mist-400">
    New to Scribly?
    <a routerLink="/register" class="font-semibold text-acid-300 transition hover:text-acid-200">Create an account</a>
  </p>
</app-auth-shell>

<app-auth-shell
  eyebrow="Password help"
  title="Reset unavailable"
  subtitle="The current backend API does not expose a password reset endpoint."
>
  <div class="glass-inset rounded-2xl p-5 text-sm leading-7 text-mist-300">
    Password recovery is not wired up yet. Contact the workspace owner if you are locked out of your account.
  </div>

  <a routerLink="/login" class="btn-primary mt-6 w-full">Return to sign in</a>

  <p class="mt-5 text-center text-sm text-mist-400">
    Need an account?
    <a routerLink="/register" class="font-semibold text-acid-300 transition hover:text-acid-200">Create one</a>
  </p>
</app-auth-shell>

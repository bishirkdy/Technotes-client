<app-auth-shell
  eyebrow="Create your reading account"
  title="Start reading"
  subtitle="Keep your place, save notes, and return to them on any device."
>
  @if (error) {
    <div class="mb-5 rounded-2xl border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm text-rose-200">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="submit()" class="space-y-4">
    <label class="field-label">
      Username
      <input
        [(ngModel)]="userName"
        name="userName"
        autocomplete="username"
        class="field mt-2"
        placeholder="your-handle"
      />
    </label>

    <label class="field-label">
      Email
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        autocomplete="email"
        class="field mt-2"
        placeholder="you@example.com"
      />
    </label>

    <label class="field-label">
      Password
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        autocomplete="new-password"
        class="field mt-2"
        placeholder="At least 8 characters"
      />
    </label>

    <button
      type="submit"
      [disabled]="loading"
      class="btn-primary w-full disabled:opacity-60"
    >
      {{ loading ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-mist-400">
    Already have an account?
    <a routerLink="/login" class="font-semibold text-acid-300 transition hover:text-acid-200">Sign in</a>
  </p>
</app-auth-shell>

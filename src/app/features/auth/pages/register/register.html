<div class="min-h-screen bg-gray-50 px-6 py-12"><div class="mx-auto max-w-md"><a routerLink="/" class="text-xl font-bold text-gray-900">TechNotes</a><div class="mt-8 rounded-2xl border border-gray-200 bg-white p-8"><h1 class="text-2xl font-bold">Create account</h1><p class="mt-1 text-sm text-gray-500">Start building your knowledge base.</p>@if(error){<div class="mt-5 rounded-lg bg-red-50 p-3 text-sm text-red-600">{{error}</div>}<form (ngSubmit)="submit()" class="mt-6 space-y-4"><label class="block text-sm font-medium">Username<input [(ngModel)]="userName" name="userName" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2.5"/></label><label class="block text-sm font-medium">Email<input [(ngModel)]="email" name="email" type="email" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2.5"/></label><label class="block text-sm font-medium">Password<input [(ngModel)]="password" name="password" type="password" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2.5"/></label><button [disabled]="loading" class="w-full rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white">{{loading?'Creating...':'Create account'}}</button></form><p class="mt-5 text-center text-sm text-gray-500">Already have an account? <a routerLink="/login" class="font-semibold text-gray-900">Sign in</a></p></div></div></div>

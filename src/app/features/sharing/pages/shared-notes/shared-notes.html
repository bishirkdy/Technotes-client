<div class="space-y-6">
  <app-page-header
    eyebrow="Collaboration"
    title="Shared with me"
    description="Notes other people have explicitly shared with your account."
  >
    <a routerLink="/app/notes" class="btn-ghost text-xs">Go to my notes</a>
  </app-page-header>

  @if (loading) {
    <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
      @for (item of [1, 2, 3]; track item) {
        <div class="skeleton h-64 rounded-3xl"></div>
      }
    </div>
  } @else if (error) {
    <app-empty-state title="Could not load shared notes" [message]="error">
      <button type="button" class="btn-ghost text-xs" (click)="load()">Try again</button>
    </app-empty-state>
  } @else if (notes.length === 0) {
    <app-empty-state
      title="Nothing shared with you"
      message="When another user shares a note with your account, it will appear here."
    >
      <a routerLink="/notes" class="btn-ghost text-xs">Browse documentation</a>
    </app-empty-state>
  } @else {
    <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
      @for (note of notes; track note.id) {
        <app-note-card [note]="note" />
      }
    </div>
  }
</div>

<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold text-gray-900">Shared Notes</h1>
    <p class="mt-1 text-sm text-gray-500">
      Notes available to you from other people and public collections.
    </p>
  </div>
  <div class="grid gap-5 md:grid-cols-2">
    @for (note of notes; track note.id) {
      <article class="rounded-2xl border border-gray-200 bg-white p-5">
        <div class="flex items-center justify-between">
          <span class="rounded-full bg-green-50 px-2.5 py-1 text-xs font-medium text-green-700">{{
            note.visibility
          }}</span
          ><span class="text-xs text-gray-400">by {{ note.author }}</span>
        </div>
        <h2 class="mt-4 text-lg font-semibold text-gray-900">{{ note.title }}</h2>
        <p class="mt-2 text-sm text-gray-500">{{ note.description }}</p>
        <a [routerLink]="['/notes', note.id]" class="mt-5 inline-block text-sm font-semibold"
          >Open note →</a
        >
      </article>
    }
  </div>
</div>

<section class="border-t border-gray-100 bg-gray-50"><div class="mx-auto max-w-7xl px-6 py-20"><div class="flex items-end justify-between"><div><p class="text-sm font-medium text-gray-500">RECENT</p><h2 class="mt-2 text-2xl font-semibold tracking-tight text-gray-900">Recently added</h2><p class="mt-2 text-gray-600">Discover the latest public notes.</p></div><a routerLink="/notes" class="hidden text-sm font-medium text-gray-700 sm:block">Browse all →</a></div>@if(notes.length===0){<p class="mt-8 text-gray-500">No public notes yet.</p>}@else{<div class="mt-8 divide-y divide-gray-200 rounded-xl border border-gray-200 bg-white">@for(note of notes;track note.id){<a [routerLink]="['/notes',note.id]" class="block p-6 transition hover:bg-gray-50"><div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"><div><h3 class="font-medium text-gray-900">{{note.title}}</h3><p class="mt-1 line-clamp-1 text-sm text-gray-500">{{preview(note)}}</p></div><span class="text-xs text-gray-400">{{note.sections.length}} sections</span></div></a>}</div>}</div></section>

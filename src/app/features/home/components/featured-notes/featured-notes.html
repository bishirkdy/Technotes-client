<section class="bg-white"><div class="mx-auto max-w-7xl px-6 py-20"><div class="flex items-end justify-between"><div><p class="text-sm font-medium text-gray-500">FEATURED</p><h2 class="mt-2 text-2xl font-semibold tracking-tight text-gray-900">Featured notes</h2><p class="mt-2 text-gray-600">Explore useful knowledge from the community.</p></div><a routerLink="/notes" class="hidden text-sm font-medium text-gray-700 sm:block">View all →</a></div>@if(loading){<p class="mt-10 text-gray-500">Loading...</p>}@else if(notes.length===0){<p class="mt-10 text-gray-500">No public notes yet.</p>}@else{<div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">@for(note of notes;track note.id){<article class="rounded-xl border border-gray-200 p-6 transition hover:border-gray-400"><div class="flex items-center justify-between"><span class="text-xs font-medium text-gray-500">Public</span><span class="text-xs text-gray-400">{{note.sections.length}} sections</span></div><h3 class="mt-4 text-lg font-semibold text-gray-900">{{note.title}}</h3><p class="mt-3 line-clamp-3 text-sm leading-6 text-gray-600">{{preview(note)}}</p><div class="mt-6 flex justify-end"><a [routerLink]="['/notes',note.id]" class="text-sm font-medium text-gray-700">Read →</a></div></article>}</div>}</div></section>
